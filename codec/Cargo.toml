[package]
name = "raptorcast-browser-codec"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[[bin]]
name = "native-check"
path = "native-check.rs"
test = false

[dependencies]
monad-raptor = { path = "source" }
rand = { version = "=0.8.5", default-features = false, features = ["alloc"] }
rand_chacha = { version = "=0.3.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[workspace]
